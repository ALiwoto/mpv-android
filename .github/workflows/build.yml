name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64 secret'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Missing ANDROID_KEYSTORE_PASSWORD secret'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mpv-release.p12"
          keytool -list -keystore "$RUNNER_TEMP/mpv-release.p12" -storepass:env KEYSTORE_PASSWORD -alias mpv-quest
          echo "ANDROID_SIGNING_KEY=$RUNNER_TEMP/mpv-release.p12" >> "$GITHUB_ENV"
          echo 'ANDROID_SIGNING_ALIAS=mpv-quest' >> "$GITHUB_ENV"

      - name: Export env vars
        run: buildscripts/include/ci.sh export >>$GITHUB_ENV

      - uses: actions/cache@v6
        with:
          path: gh-cache/
          key: "${{ env.CACHE_IDENTIFIER }}"
          enableCrossOsArchive: true

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkgconf libtool ninja-build python3-pip python3-venv gperf nasm
          python3 -m venv "$RUNNER_TEMP/mpv-build-tools"
          "$RUNNER_TEMP/mpv-build-tools/bin/pip" install meson
          echo "$RUNNER_TEMP/mpv-build-tools/bin" >> "$GITHUB_PATH"

      - name: Download or build deps
        run: |
          mkdir -p "$CACHE_FOLDER"
          buildscripts/include/ci.sh install
        env:
          CACHE_MODE: "folder"
          CACHE_FOLDER: "${{ github.workspace }}/gh-cache"

      - name: Build
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          buildscripts/include/ci.sh build

      - name: Upload signed ARM64 APK
        uses: actions/upload-artifact@v7
        with:
          name: mpv-android-arm64-v8a-release
          path: app/build/outputs/apk/default/release/app-default-arm64-v8a-release-signed.apk
          archive: false
          if-no-files-found: error

      - name: Upload signed ARMv7 APK
        uses: actions/upload-artifact@v7
        with:
          name: mpv-android-armeabi-v7a-release
          path: app/build/outputs/apk/default/release/app-default-armeabi-v7a-release-signed.apk
          archive: false
          if-no-files-found: error

      - name: Remove runner signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/mpv-release.p12"
